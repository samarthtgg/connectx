name: Bug report
description: Report a reproducible problem in ConnectX
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private messages, phone numbers, or other personal data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: I expected..., but...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the problem.
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and environment
      description: Include device, Android version, browser/app version, and network type if relevant.
      placeholder: "Device: / Android: / Browser or app: / Network:"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs (optional)
      description: Remove private information before attaching anything.
    validations:
      required: false
