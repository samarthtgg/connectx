name: Refresh contributor wall

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contributor-wall
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate clickable contributor cards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build contributor wall
        uses: YauhenBichel/readme-contributors@3f3b442309052873cae16e7fce8a28f465a88768 # v1.9.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          format: html
          layout: stickers
          theme: midnight
          max: 100

      - name: Commit updated wall
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/faces
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh contributor wall"
          git push
