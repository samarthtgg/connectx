name: ConnectX quality checks

on:
  push:
    branches:
      - release/v1.0
  pull_request:
    branches:
      - release/v1.0

permissions:
  contents: read

concurrency:
  group: connectx-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectx-app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connectx-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run ESLint and TypeScript checks
        run: npm run check
